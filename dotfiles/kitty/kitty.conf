# --- FONT SETTINGS ---
# Using your preferred JetBrains Mono Nerd Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# Optimized for your modern 16:9 MSI high-refresh panel
# Shifted from harsh 5:4 line-thickness hacks to a cleaner, readable rendering
modify_font cell_height 115%
modify_font weight +10%
text_composition_strategy legacy

# --- WINDOW LAYOUT ---
# Slightly adjusted padding for maximum screen real estate in Hyprland
window_padding_width 18 22
hide_window_decorations yes
confirm_os_window_close 0

# --- FROSTED GLASS ---
# Translucency comes from generated/kitty/colors.conf (below): Settings > Appearance > Frosted glass
# turns it on or off together with the rest of the desktop. Needed so a config reload can change it live.
dynamic_background_opacity yes

# --- READABILITY HELPERS ---
dim_opacity 0.90
bold_is_bright yes

# --- PERFORMANCE & BEHAVIOR (TUNED FOR 100Hz) ---
enable_audio_bell no
sync_to_monitor yes
# Dropping repaint delay to ~6ms maximizes fluidity for 100Hz setups
repaint_delay 6
input_delay 2
cursor_shape beam
cursor_blink_interval 0.5

# --- MOUSE & URLS ---
detect_urls yes
url_style curly
open_url_with librewolf
copy_on_select yes

# --- TAB BAR ---
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_edge top
active_tab_foreground   #1a1b26
active_tab_background   #7aa2f7
in
# -----------------------------------------------------------------------------
# Cursor Customization & Smooth Animations
# -----------------------------------------------------------------------------

# Cursor shape (block, beam, or underline)
cursor_shape beam

# -----------------------------------------------------------------------------
# Kitty Smooth Motion Tuning
# -----------------------------------------------------------------------------

# Sync rendering to monitor refresh rate (prevents micro-stuttering)
sync_to_monitor yes

# Set decay to allow smooth trail fading on every jump
cursor_trail 5
cursor_trail_decay 0.05 0.25
cursor_trail_start_threshold 1

# Faster blink cycle for less abrupt blinking
cursor_blink_interval 0.45
cursor_stop_blinking_after 0

# Smooth scrolling physics
wheel_scroll_multiplier 2.0
touch_scroll_multiplier 2.0

# Colours come from the active Cozytile theme (regenerated by theme-apply.sh)
include ~/.config/cozytile/generated/kitty/colors.conf
include ~/.config/cozytile/generated/kitty/font.conf
